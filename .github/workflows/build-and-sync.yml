name: UHML Build and Sync to Alist

# 定义触发条件：手动触发 (workflow_dispatch) 和 Release 发布 (release)
on:
    workflow_dispatch:
    release:
        types: [published]

# 定义环境变量
env:
    BUILD_OUTPUT_DIR: output

jobs:
    build_and_sync:
        runs-on: hposs-self-hosted

        # 确保 secrets.WEBDAV_HOST 等 WebDAV 相关的 secrets 在您的仓库中已配置

        steps:
            # 1. 检出仓库代码 (使用 actions/checkout@v4 最新版本)
            - name: ⚙️ Checkout repository
              uses: actions/checkout@v4
              with: 
                github-server-url: "https://hk.gh-proxy.org/https://github.com/"

            # # 2. 设置 Node.js 环境 (使用 actions/setup-node@v4 最新版本)
            # #    同时启用 pnpm 缓存
            # - name: 🟢 Setup Node.js & Cache
            #   uses: actions/setup-node@v4
            #   with:
            #       node-version: "22" # 请根据需要选择合适的 Node.js 版本
            #       cache: "pnpm" # 启用 pnpm 依赖缓存

            # 3. 设置 pnpm (使用 pnpm/action-setup@v3)
            #    这会取代你手动执行的 'npm install -g pnpm' 和 'pnpm setup'
            - name: 📦 Setup pnpm environment
              uses: pnpm/action-setup@v3
              with:
                  version: 8 # 指定 pnpm 版本
                  # 不需要 run_install, 因为你的代码中没有依赖安装步骤，只有全局安装

            # 4. 初始化 npm/pnpm 项目 (如果需要 package.json)
            #    注意：如果你的仓库中已经有 package.json，请删除此步骤。
            - name: 📦 Initialize pnpm project
              run: pnpm init

            - name: 🏗️ Build
              run: |
                  # pnpm add -g 路径已经由 pnpm/action-setup 处理，无需 source
                  pnpm add -g @mclhomeplaza/uhml-builder

                  # 执行构建命令 (根据你的上下文，这可能是安装包的 CLI 命令)
                  uhmlbuilder

            # --- rclone 配置和同步步骤 (保持不变) ---

            # 7. 安装 rclone (保持不变)
            - name: 🚀 Install rclone
              run: |
                  echo "${{ secrets.SUDO_PWD }}" | sudo -S bash -c "curl -sL https://rclone.org/install.sh | bash"

            # 8. 配置 rclone for WebDAV (Alist) (保持不变)
            - name: ⚙️ Configure rclone for WebDAV (Alist)
              run: |
                  # 请注意，/dav 是 Alist WebDAV 的默认路径，如果您的配置不同请修改
                  rclone config create alist_webdav webdav \
                    url http://${{ secrets.WEBDAV_HOST }}:${{ secrets.WEBDAV_PORT }}/dav \
                    user ${{ secrets.ALIST_USERNAME }} \
                    pass ${{ secrets.ALIST_PASSWORD }}

            # 9. 替换文件到目标目录 (保持不变)
            - name: 📤 Copy build files to Alist WebDAV
              run: |
                  rclone copy $BUILD_OUTPUT_DIR/Custom.xaml alist_webdav:/ --checksum --size-only --retries 3
                  rclone copy $BUILD_OUTPUT_DIR/Custom.xaml.ini alist_webdav:/ --checksum --size-only --retries 3
                  rclone copy $BUILD_OUTPUT_DIR/Custom.AST.json alist_webdav:/ --checksum --size-only --retries 3

            # 10. 清理 rclone 配置 (保持不变)
            - name: 🧹 Clean up rclone config
              if: always()
              run: rm -rf ~/.config/rclone
