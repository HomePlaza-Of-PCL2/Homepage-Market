name: UHML Build and Sync to Alist

# 定义触发条件：手动触发 (workflow_dispatch) 和 Release 发布 (release)
on:
    workflow_dispatch:
    release:
        types: [published]

# 定义环境变量
env:
    BUILD_OUTPUT_DIR: output

jobs:
    build_and_sync:
        runs-on: hposs-self-hosted

        steps:
            - name: ⚙️ Checkout repository
              uses: actions/checkout@v4

            - name: 🏗️ Build
              run: |
                  uhmlbuilder

            # 6. 确认构建输出文件是否存在 (调试和检查)
            - name: 🔍 Check build output files
              run: |
                  echo "Listing contents of $BUILD_OUTPUT_DIR:"
                  # 检查目录是否存在，不存在则创建（可选）
                  if [ ! -d "$BUILD_OUTPUT_DIR" ]; then
                    echo "Error: Build output directory $BUILD_OUTPUT_DIR not found!"
                    exit 1
                  fi
                  ls -l $BUILD_OUTPUT_DIR/
                  if [ ! -f $BUILD_OUTPUT_DIR/Custom.xaml ]; then
                    echo "Error: output/Custom.xaml not found!"
                    exit 1
                  fi

            # --- rclone 配置和同步步骤 (保持不变) ---

            # 7. 安装 rclone (保持不变)
            - name: 🚀 Install rclone
              run: |
                  curl https://rclone.org/install.sh | sudo bash

            # 8. 配置 rclone for WebDAV (Alist) (保持不变)
            - name: ⚙️ Configure rclone for WebDAV (Alist)
              run: |
                  # 请注意，/dav 是 Alist WebDAV 的默认路径，如果您的配置不同请修改
                  rclone config create alist_webdav webdav \
                    url http://${{ secrets.WEBDAV_HOST }}:${{ secrets.WEBDAV_PORT }}/dav \
                    user ${{ secrets.ALIST_USERNAME }} \
                    pass ${{ secrets.ALIST_PASSWORD }}

            # 9. 替换文件到目标目录 (保持不变)
            - name: 📤 Copy build files to Alist WebDAV
              run: |
                  rclone copy $BUILD_OUTPUT_DIR/Custom.xaml alist_webdav:/ --checksum --size-only --retries 3
                  rclone copy $BUILD_OUTPUT_DIR/Custom.xaml.ini alist_webdav:/ --checksum --size-only --retries 3
                  rclone copy $BUILD_OUTPUT_DIR/Custom.AST.json alist_webdav:/ --checksum --size-only --retries 3

            # 10. 清理 rclone 配置 (保持不变)
            - name: 🧹 Clean up rclone config
              if: always()
              run: rm -rf ~/.config/rclone
